[project]
name = "setuscan"
version = "0.1.0"
description = "SetuScan: agentic crack inspection with mm measurement and change tracking, built on OpenCV 5"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-contrib-python-headless==5.0.0.93",
    "numpy>=2.0,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "reportlab>=4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
